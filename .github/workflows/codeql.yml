name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'app/src/**/*.kt'
      - 'app/src/**/*.java'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/**/*.kt'
      - 'app/src/**/*.java'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/codeql.yml'
  schedule:
    # Weekly baseline refresh, Monday 04:23 UTC (odd minute to avoid the
    # top-of-hour scheduling stampede GitHub docs warn about).
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # v3.2.2 defaults to 'tools platform-tools'. Google removed the
          # long-deprecated 'tools' package, so sdkmanager exits 1 and every
          # Gradle job dies at setup. platform-tools is all we actually use.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build for CodeQL tracing
        # CodeQL traces compiler invocations, so every flag here exists to
        # force real compilation to happen in-process:
        #   --no-daemon: the daemon detaches compilers from the traced tree
        #   --no-build-cache: gradle.properties sets org.gradle.caching=true;
        #     a cache hit means NO compiler runs and CodeQL sees no source
        #     (guaranteed on cron runs and any PR without Kotlin changes)
        #   --no-configuration-cache: same failure mode via the config cache
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache assembleDebug --stacktrace
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:java-kotlin'
